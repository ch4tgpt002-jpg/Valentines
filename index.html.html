<!DOCTYPE html>
<html>
<head>
  <title>Be My Valentine 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
      background: #fff5f8;
      overflow: hidden;
    }

    h1 {
      font-size: 36px;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
      margin-right: 10px;
    }

    #noBtn {
      background: #cccccc;
    }

    /* POPUP OVERLAY */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
      padding: 20px;
    }

    .popup-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: popIn 0.6s ease-out;
    }

    .popup-content h2 {
      color: white;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .popup-content img {
      max-width: 85%;
      max-height: 80vh;
      border-radius: 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
    }

    @keyframes popIn {
      from {
        transform: scale(0.6);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* FLOATING HEARTS */
    .heart {
      position: fixed;
      color: #ff4d6d;
      font-size: 20px;
      animation: floatUp 4s linear forwards;
      z-index: 999;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-900px);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1 id="question">Will you be my Valentine? 💘</h1>

  <div class="buttons">
    <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
    <button id="noBtn" onclick="sayNo()">No</button>
  </div>

  <!-- POPUP IMAGE -->
  <div id="yesPopup" class="popup-overlay">
    <div class="popup-content">
      <h2>we're just 2 little peas in a pod 💚</h2>
      <img src="peas.png" alt="Peas in a Pod Love">
    </div>
  </div>

  <!-- MUSIC -->
  <audio id="loveMusic" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

  <script>
    let noCount = 0;
    let yesSize = 18;

    const noMessages = [
      "No",
      "Are you sure?",
      "Are you sure you're sure?",
      "What the hell is even that!",
      "Please say yes 🥺",
      "I won't take no for an answer!"
    ];

    function sayYes() {
      document.getElementById("question").innerText = 
        "YAYAYAYAY!! I LOVE YOU MY BEAUTIFUL GIRL 💕🥰";

      document.querySelector(".buttons").style.display = "none";

      // Show popup
      document.getElementById("yesPopup").style.display = "flex";

      // Play music
      document.getElementById("loveMusic").play();

      // Start hearts
      startHearts();
    }

    function sayNo() {
      noCount++;
      yesSize += 12;

      document.getElementById("yesBtn").style.fontSize = yesSize + "px";

      let message = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
      document.getElementById("noBtn").innerText = message;
    }

    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        heart.style.fontSize = Math.random() * 20 + 18 + "px";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 4000);
      }, 220);
    }
  </script>

</body>
</html>
